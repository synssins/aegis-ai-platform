# Aegis AI Platform — compose rev 3 (2026-09-24)
#
# Networks
#   edge        caddy(+hub), openwebui, litellm, grafana        — only caddy publishes ports; egress allowed
#   backend     litellm, ollama, litellm-db, caddy(+hub)         — internal: true; no egress; hub reads ollama state
#   mgmt        caddy(+hub), modeld                              — pull-only ollama with egress; apps never fetch models
#   monitoring  prometheus, exporters, grafana                   — profile "monitoring"
#   apps        comfyui, fish-speech (+edge for caddy)           — profile "apps"; ComfyUI is 503 at the edge until gated
#
# Profiles:  docker compose --profile monitoring --profile apps up -d
# Secrets:   ./.env (0600).  Gateway config (caddy/Caddyfile) is console-only and view-only in the hub.

x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  caddy:
    <<: *hardened
    image: caddybuilds/caddy-cloudflare:2.11.4     # upstream community build of caddy:2.11.4 + caddy-dns/cloudflare (no local fork)
    container_name: caddy
    command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
    ports: ["80:80", "443:443"]
    environment:
      - AEGIS_LAN_IP=${AEGIS_LAN_IP}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./caddy/conf:/etc/caddy/conf:ro               # directory mount: follows file replacement (a file mount pins the inode)
      - ./caddy/sites-enabled:/etc/caddy/sites-enabled:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks: [edge, backend, mgmt, monitoring, apps]     # monitoring: the hub (caddy netns) reads Prometheus for /status and Metrics
    read_only: true
    tmpfs: [/tmp]
    cap_add: [NET_BIND_SERVICE]

  hub:
    # Admin control centre. Shares caddy's network namespace: reaches Caddy admin (localhost:2019),
    # LiteLLM, ollama (backend, read/delete), modeld (mgmt, pulls). Reachable only via caddy at /hub
    # behind basic-auth. Holds the LiteLLM master key (key/model management) — every action audited.
    <<: *hardened
    image: aegis/hub:5                             # caddy/hub/build/Dockerfile — python:3.12-alpine + argon2id + Fernet + qrcode
    container_name: hub
    command: ["python3", "-u", "/app/hub.py"]
    environment:
      - AEGIS_LAN_IP=${AEGIS_LAN_IP}
      - GUARD_OLLAMA=http://ollama-intel:11434         # where the hub loads/checks the safety classifier
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - HUB_SECRET_KEY=${HUB_SECRET_KEY}
      - VETO_EVIDENCE_KEY=${VETO_EVIDENCE_KEY}      # evidence handoff export (re-encrypts one record with a fresh key)
      - GRAFANA_ENABLED=${GRAFANA_ENABLED:-0}
    volumes:
      - ./caddy/hub/hub.py:/app/hub.py:ro
      - ./caddy/hub/browse.py:/app/browse.py:ro
      - ./caddy/hub/imagegate.py:/app/imagegate.py:ro
      - ./gallery:/app/gallery                        # approved images per user; users purge their own
      - ./comfyui:/app/comfy-store                # model browser downloads (checkpoints/, loras/, …); ComfyUI reads the same tree
      - ./caddy/conf:/etc/caddy/conf:ro
      - ./docker-compose.yml:/app/view/docker-compose.yml:ro
      - ./caddy/sites-enabled:/etc/caddy/sites-enabled
      - ./caddy/hub/state:/app/state
      - ./proxy/policy:/app/policy
      - ./proxy/audit:/app/audit
      - ./proxy/evidence:/app/evidence
      - ./ops/requests:/app/ops/requests          # hub writes ONE request.json; the host watchdog consumes it
      - ./ops/responses:/app/ops/responses:ro     # watchdog results + status.json
    network_mode: "service:caddy"
    depends_on: [caddy]
    read_only: true
    tmpfs: [/tmp]

  modeld:
    # Pull-only Ollama. No GPU, egress via mgmt, shares the model store. Only the hub talks to it.
    <<: *hardened
    image: ollama/ollama:0.34.3
    container_name: modeld
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ./llm/gguf:/root/.ollama
    networks: [mgmt]

  openwebui:
    <<: *hardened
    image: ghcr.io/open-webui/open-webui:v0.11.4
    container_name: openwebui
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${OPENWEBUI_UPSTREAM_KEY}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=https://${AEGIS_LAN_IP}
      - CORS_ALLOW_ORIGIN=https://${AEGIS_LAN_IP};https://${AEGIS_PUBLIC_HOSTNAME:-localhost}
      - ENABLE_SIGNUP=false
      - DEFAULT_MODELS=${OPENWEBUI_DEFAULT_MODEL:-gemma3}
      - DEFAULT_USER_ROLE=pending
      - ENABLE_OLLAMA_API=false
      - ENABLE_DIRECT_CONNECTIONS=false
      - ENABLE_WEB_SEARCH=false
      - ENABLE_PERSISTENT_CONFIG=false
      - ENABLE_COMMUNITY_SHARING=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
    volumes:
      - ./openwebui:/app/backend/data
    networks: [edge]

  litellm:
    <<: *hardened
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: --config /app/config/config.yaml --port 4000
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True                      # models exposed from the hub persist in the DB
      - DISABLE_ADMIN_UI=True
      - LITELLM_LOG=INFO
      - VETO_GUARD_URL=http://ollama-intel:11434        # classifier pool (Intel Arc); fail-closed if unreachable
      - VETO_POLICY_PATH=/app/policy/veto-policy.json
      - VETO_AUDIT_PATH=/app/audit/veto-audit.jsonl
      - VETO_EVIDENCE_DIR=/app/evidence
      - VETO_EVIDENCE_KEY=${VETO_EVIDENCE_KEY}
    volumes:
      - ./proxy/evidence:/app/evidence
      - ./proxy/config.yaml:/app/config/config.yaml:ro
      - ./proxy/veto_filter.py:/app/custom_logger/veto_filter.py:ro
      - ./proxy/policy:/app/policy:ro
      - ./proxy/audit:/app/audit
    networks: [edge, backend]
    depends_on:
      litellm-db:
        condition: service_healthy

  litellm-db:
    <<: *hardened
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - ./proxy/db:/var/lib/postgresql/data
    networks: [backend]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_READ_SEARCH]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    <<: *hardened
    image: ollama/ollama:0.34.3
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    # GPUs via CDI (nvidia-ctk cdi generate -> /etc/cdi/nvidia.yaml): device nodes are injected into the
    # container spec directly, so a host `systemctl daemon-reload` no longer strips them (NVML Unknown Error).
    devices:
      - nvidia.com/gpu=all
    volumes:
      - ./llm/gguf:/root/.ollama
    networks: [backend]

  # ---------------------------------------------------------------- monitoring (profile) ----
  ollama-intel:
    # GPU pool "intel": the two Arc Pro B60 on Ollama's Vulkan backend (stock image, no fork). Holds the safety
    # classifier by policy so the NVIDIA pool keeps its memory for the chat model and image generation.
    # Pass ONLY the Intel render/card nodes and the Intel Vulkan ICD: the whole /dev/dri (virtio display) hangs
    # discovery in a VM. Map nodes with: for r in /sys/class/drm/renderD*; do echo $(basename $r) $(basename $(readlink -f $r/device)); done
    <<: *hardened
    image: ollama/ollama:0.34.3
    container_name: ollama-intel
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_VULKAN=1
      - VK_DRIVER_FILES=/usr/share/vulkan/icd.d/intel_icd.json
      - OLLAMA_CONTEXT_LENGTH=8192
    devices:
      - /dev/dri/renderD129
      - /dev/dri/renderD131
      - /dev/dri/card0
      - /dev/dri/card3
    group_add: ["991", "44"]                          # render, video (host gids)
    volumes:
      - ./llm/gguf:/root/.ollama                      # shared model store (pulled by modeld)
    networks: [backend]

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/data/prometheus:/prometheus
    networks: [monitoring]
    user: "65534:65534"

  node-exporter:
    <<: *hardened
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    profiles: [monitoring]
    command: ["--path.rootfs=/host", "--collector.disable-defaults", "--collector.cpu", "--collector.meminfo", "--collector.filesystem", "--collector.diskstats", "--collector.netdev", "--collector.loadavg", "--collector.uname"]
    volumes:
      - /:/host:ro,rslave                          # read-only host view; the one broad mount in the stack
    networks: [monitoring]
    pid: host

  dcgm-exporter:
    <<: *hardened
    image: nvidia/dcgm-exporter:4.2.3-4.1.3-ubuntu22.04
    container_name: dcgm-exporter
    profiles: [monitoring]
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
    devices:
      - nvidia.com/gpu=all
    cap_add: [SYS_ADMIN]                           # DCGM needs it for profiling metrics
    networks: [monitoring]

  grafana:
    <<: *hardened
    image: grafana/grafana:11.6.0
    container_name: grafana
    profiles: [monitoring]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://${AEGIS_PUBLIC_HOSTNAME:-${AEGIS_LAN_IP}}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ALLOW_EMBEDDING=true          # framed by the portal (same site)
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/data/grafana:/var/lib/grafana
    networks: [monitoring, edge]
    user: "472:472"

  # ---------------------------------------------------------------- apps (profile) ----------
  # Frameworks only. Not started unless `--profile apps`. GPU assignment is an operator decision.
  fish-speech:
    <<: *hardened
    image: fishaudio/fish-speech:latest             # TODO pin once selected; TTS web UI on :7860
    container_name: fish-speech
    profiles: [apps]
    volumes:
      - ./audio/voices:/app/voices
      - ./audio/checkpoints:/app/checkpoints
    networks: [apps]                                  # reachable from Caddy only — never from Open WebUI (edge)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  comfyui:
    # Image generation. Reachable ONLY through the hub's gate (Caddy: /comfy -> hub for /prompt, /view, /object_info,
    # /history; forward_auth for the rest). The hub classifies every prompt (VetoGuard), every model file (per-file
    # NSFW attribute) and every output (vision classifier) — docs/HUB.md -> Images. No egress (apps is internal).
    <<: *hardened
    image: yanwk/comfyui-boot:cu126-slim-20260921     # community image that BUNDLES upstream ComfyUI (no fork; copies /default-comfyui-bundle at first start, no download)
    container_name: comfyui
    profiles: [apps]
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188 --preview-method none --disable-auto-launch --disable-metadata
    devices:
      - nvidia.com/gpu=all                            # CDI, same as ollama (survives daemon-reload)
    volumes:
      - ./comfyui/checkpoints:/root/ComfyUI/models/checkpoints
      - ./comfyui/loras:/root/ComfyUI/models/loras
      - ./comfyui/vae:/root/ComfyUI/models/vae
      - ./comfyui/controlnet:/root/ComfyUI/models/controlnet
      - ./comfyui/upscale_models:/root/ComfyUI/models/upscale_models
      - ./comfyui/embeddings:/root/ComfyUI/models/embeddings
      - ./comfyui/output:/root/ComfyUI/output          # the hub gates and MOVES files out of here
      - ./comfyui/temp:/root/ComfyUI/temp
      - ./comfyui/user:/root/ComfyUI/user
    networks: [apps]

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  mgmt:
    driver: bridge
  monitoring:
    driver: bridge
    internal: true
  apps:
    driver: bridge
    internal: true
